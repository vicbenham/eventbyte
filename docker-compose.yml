services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: 
      - start-dev 
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./docker/eventbyte.json:/opt/keycloak/data/import/eventbyte.json
      - ./docker/themes:/opt/keycloak/providers/
    depends_on:
      - keycloak-db

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: eventbyte
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d eventbyte"]
      interval: 5s
      timeout: 3s
      retries: 10

  strapi:
    build: ./frontend/strapi
    env_file:
      - ./frontend/strapi/.env
    ports:
      - "1337:1337"
    depends_on:
      - postgres
      - rabbitmq

  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_MASTER_KEY: Cd9_wZ5drjqixClHEnbof-4h0bgktUzXwaY3yt8wJoM
      MEILI_ENV: production
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      # Clés publiques Keycloak via le réseau Docker (l'issuer reste http://localhost:8180/...)
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/eventbyte/protocol/openid-connect/certs
      # Lecture de la date des événements dans Strapi (token Read-only, dans le .env racine non versionné)
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: ./frontend/web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/web/.env:/app/.env
    command: pnpm dev --host

volumes:
  keycloak_postgres_data:
  postgres_data:
  meilisearch_data:
  rabbitmq-data:
  redis_data:

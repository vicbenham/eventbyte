spring.application.name=EventByte

# Port attendu par le frontend (VITE_API_URL par défaut : http://localhost:3000)
server.port=${SERVER_PORT:3000}

# Les valeurs par défaut ciblent les services exposés en local par docker compose.
# Dans le conteneur, docker-compose.yml les surcharge avec les noms des services.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:eventbyte}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Sécurité : validation des JWT émis par Keycloak (realm eventbyte)
# issuer-uri doit correspondre au claim iss, c'est-à-dire l'URL vue par le navigateur.
# jwk-set-uri est l'URL d'où le backend télécharge les clés publiques (keycloak:8080 dans Docker).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/eventbyte}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eventbyte/protocol/openid-connect/certs}

# Origines autorisées à appeler l'API depuis un navigateur (frontend Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API REST Strapi : lecture de la date des événements (absente du message RabbitMQ).
# Token à créer dans l'admin Strapi : Settings > API Tokens > type "Read-only".
strapi.url=${STRAPI_URL:http://localhost:1337}
strapi.api-token=${STRAPI_API_TOKEN:}

# Meilisearch : index de recherche des événements (GET /events/search)
meilisearch.host=${MEILISEARCH_HOST:http://localhost:7700}
meilisearch.api-key=${MEILISEARCH_API_KEY:Cd9_wZ5drjqixClHEnbof-4h0bgktUzXwaY3yt8wJoM}

# Réservations : délai pour payer avant expiration (le frontend affiche un compte à rebours de 10 min)
# et fréquence de la tâche qui expire les réservations échues
booking.expiration=${BOOKING_EXPIRATION:PT10M}
booking.expiration-check-interval=${BOOKING_EXPIRATION_CHECK_INTERVAL:PT15S}

# Stripe (mode test) : clé secrète sk_test_... dans le .env racine (STRIPE_SECRET_KEY), jamais versionnée
stripe.api-url=${STRIPE_API_URL:https://api.stripe.com}
stripe.secret-key=${STRIPE_SECRET_KEY:}
# Secret de signature des webhooks (whsec_...) : POST /payments/stripe/webhook
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/

# Healthcheck docker : /actuator/health agrège Postgres, RabbitMQ et Redis
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
